pid /tmp/nginx.pid;
master_process off;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type text/html;
    access_log off;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Match protected NAMES anywhere, including duplicates. Never use cookie values.
    map $http_cookie $ad_sensitive_cookie {
        default 0;
        "~*__SENSITIVE_COOKIE_PATTERN__" 1;
    }
    server {
        listen 8080;
        server_tokens off;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Ad-Protected-Cookie $ad_sensitive_cookie always;
        add_header Content-Security-Policy "frame-ancestors __PARENT_ORIGINS__; base-uri 'none'; object-src 'none'; form-action 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        error_page 403 404 405 409 /unavailable.html;
        location = /health { return 200 "ok\n"; }
        location ~ "^/banner/[a-f0-9]{64}\.html$" {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            # Benign advertising cookies are not application credentials.
            # Reject protected credentials (including HttpOnly/domain-wide ones).
            if ($ad_sensitive_cookie) { return 409; }
            if ($args != "") { return 404; }
            try_files $uri =404;
        }
        location = /unavailable.html { internal; }
        location / { return 404; }
    }
}
