# Explicit opt-in overlay. Do not start alongside a diagnostic ads.tdrp.cc router.
services:
  filestreambot:
    environment:
      WEB_ADS_DOCUMENT_ORIGIN: ${WEB_ADS_DOCUMENT_ORIGIN:?Set the distinct HTTPS ad origin}
  traefik:
    networks:
      - proxy
      - ad-documents
  ad-documents:
    build:
      context: ./deploy/ads
    image: ${WEB_ADS_IMAGE:-filestream-ad-documents:local}
    user: "101:101"
    command: ["nginx", "-c", "/etc/nginx/ad-documents.conf", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 64m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    volumes:
      - ${WEB_ADS_PUBLIC_DIR:?Export a versioned public ad bundle first}/html:/usr/share/nginx/html:ro
      - ${WEB_ADS_PUBLIC_DIR:?Export a versioned public ad bundle first}/nginx.conf:/etc/nginx/ad-documents.conf:ro
    networks:
      - ad-documents
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${WEB_ADS_NETWORK:-filestreambot-ad-documents}
      traefik.http.routers.ad-documents.rule: Host(`${WEB_ADS_HOST:?Set the ad hostname}`)
      traefik.http.routers.ad-documents.entrypoints: websecure
      traefik.http.routers.ad-documents.tls: "true"
      traefik.http.routers.ad-documents.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.ad-documents.service: ad-documents
      traefik.http.services.ad-documents.loadbalancer.server.port: "8080"
networks:
  ad-documents:
    name: ${WEB_ADS_NETWORK:-filestreambot-ad-documents}
    external: true
