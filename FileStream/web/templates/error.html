<!doctype html>
<html lang="en" class="dark scroll-smooth" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <title>{{ title }} — {{ bot_brand }}</title>

  <!-- Google Fonts: Geist & Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/tokens.css?v={{ version }}" />
  <link rel="stylesheet" href="/static/main.css?v={{ version }}" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-black text-[#ededed] font-sans antialiased min-h-screen flex flex-col selection:bg-white selection:text-black">
  <div class="fixed inset-0 bg-grid-pattern pointer-events-none z-0"></div>
  <div class="fixed inset-0 bg-radial-vignette pointer-events-none z-0"></div>

  <!-- Header -->
  <header class="sticky top-0 z-50 w-full border-b border-white/[0.08] bg-black/75 backdrop-blur-xl">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 group">
        <div class="w-6 h-6 rounded-md bg-white flex items-center justify-center text-black font-bold text-xs tracking-tighter transition-transform group-hover:scale-95">
          ▲
        </div>
        <span class="font-semibold tracking-tight text-white text-sm flex items-center gap-1.5">
          {{ bot_brand }}
        </span>
      </a>

      {% if bot_join_url %}
      <a href="{{ bot_join_url }}" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-black bg-white rounded-full hover:bg-zinc-200 transition-all active:scale-95 shadow-[0_0_15px_rgba(255,255,255,0.2)]" target="_blank" rel="noopener noreferrer">
        <i data-lucide="bot" class="w-3.5 h-3.5"></i>
        <span>Join Bot</span>
      </a>
      {% endif %}
    </div>
  </header>

  <!-- Main Content -->
  <main class="relative z-10 flex-1 max-w-xl w-full mx-auto px-4 py-12 flex flex-col justify-center">
    <!-- Top Ad Slot -->
    {% if ad_config and ad_config.mobile.top_banner.enabled %}
    <div class="ad-slot-wrapper">
      <span class="text-[10px] font-mono uppercase tracking-widest text-zinc-600 mb-1">Sponsored</span>
      <div class="ad-slot"
        data-device="{{ ad_config.mobile.top_banner.device }}"
        data-key="{{ ad_config.mobile.top_banner.key }}"
        data-width="{{ ad_config.mobile.top_banner.width }}"
        data-height="{{ ad_config.mobile.top_banner.height }}"
        data-invoke-url="{{ ad_config.mobile.top_banner.invoke_url }}"></div>
    </div>
    {% endif %}

    <div class="fs-card p-6 sm:p-8 text-center flex flex-col items-center animate-fade-in">
      <div class="w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-400 flex items-center justify-center mb-5">
        <i data-lucide="alert-triangle" class="w-8 h-8"></i>
      </div>

      <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight leading-snug">
        {{ title }}
      </h1>
      <p class="text-sm text-zinc-400 mt-2.5 max-w-md leading-relaxed">
        {{ message }}
      </p>

      <div class="flex flex-wrap items-center justify-center gap-3 mt-7 w-full">
        <button type="button" onclick="if (history.length > 1) { history.back(); } else { window.location.href='/'; }" class="fs-btn-secondary min-h-[44px]">
          <i data-lucide="arrow-left" class="w-4 h-4 text-zinc-400"></i>
          <span>Go Back</span>
        </button>
        <a href="/" class="fs-btn-secondary min-h-[44px]">
          <i data-lucide="home" class="w-4 h-4 text-zinc-400"></i>
          <span>Home</span>
        </a>
        {% if bot_join_url %}
        <a href="{{ bot_join_url }}" class="fs-btn-primary min-h-[44px]" target="_blank" rel="noopener noreferrer">
          <i data-lucide="send" class="w-4 h-4 text-black"></i>
          <span>Open in Telegram</span>
        </a>
        {% endif %}
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/[0.08] bg-black text-xs text-zinc-500 py-6 mt-auto">
    <div class="max-w-2xl mx-auto px-4 flex items-center justify-between">
      <span>{{ bot_brand }} · Status & Support</span>
      <div class="flex gap-4 text-zinc-400">
        <a href="/" class="hover:text-white transition">Home</a>
        <a href="{{ legal_url }}" class="hover:text-white transition">Terms</a>
        <a href="{{ privacy_url }}" class="hover:text-white transition">Privacy</a>
      </div>
    </div>
  </footer>

  <script src="/static/app.js?v={{ version }}"></script>
</body>
</html>
